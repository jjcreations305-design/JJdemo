name: Build JJ Frequency Chat APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: JJ_Frequency_Chat_Android_Project
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: JJ-Frequency-Chat-APK
          path: JJ_Frequency_Chat_Android_Project/app/build/outputs/apk/debug/*.apk
